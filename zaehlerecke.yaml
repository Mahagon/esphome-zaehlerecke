---
# Zählerecke: liest den Gaszähler über einen Reedkontakt und den
# Hauptwasserzähler über einen TCRT5000 am Sternrad aus.
# Board: ESP32-DevKit (ESP32-WROOM-32)
#
# Verdrahtung:
#   Reedkontakt MK04 (Gas)       GPIO27 und GND, wie herum ist egal
#   TCRT5000 Wasser (Heitland)   VCC an 3V3, GND an GND, A0 an GPIO34, D0 bleibt frei
#   Allmess-Gartenzähler (später) Impulsmodul PM +m an GPIO33 und GND (falls Kontaktausgang)
#
# Die Secrets stehen in secrets.yaml. Die Datei ist nicht im Git,
# eine Vorlage liegt in secrets.yaml.example.

substitutions:
  name: zaehlerecke
  friendly_name: Zählerecke

  # Auf dem Typenschild des Apator Metrix G4 steht "1 imp = 0,01 m³".
  gas_m3_per_pulse: "0.01"

  # Nach so vielen ms ohne Gas-Impuls gilt der Durchfluss als 0 (10 min).
  gas_flow_timeout_ms: "600000"

  # Heitland: Der TCRT5000 sieht die Zacken des schwarzen Sternrads (6 pro
  # Umdrehung). Wie viel Wasser ein Zacken ist, steht nicht auf dem Zähler.
  # Gemessen am 2026-11-12 gegen die Zeiger: 8,5 L ergaben 220 Impulse, also
  # etwa 38,6 mL pro Impuls (±4 %, Ablesefehler und Impulse beim Auf- und
  # Absetzen der Haube). Nach einigen Tagen gegen den Zählerstand nachjustieren:
  #   neu = alt × (Verbrauch am Zähler / Verbrauch in Home Assistant)
  # Angabe in Mikrolitern, damit keine Nachkommastellen verloren gehen.
  water_main_ul_per_pulse: "38600"

  # Schaltschwellen für A0 in Volt. Gemessen am 2026-11-12 bei laufendem
  # Wasser (langsam und voll): Min 1,52 V, Max 1,60 V, Rauschen in Ruhe
  # 0,016 V. Bei so kleinem Hub braucht die Hysterese mehr Abstand als üblich:
  #   upper = Min + 70 % der Spanne, lower = Min + 30 % der Spanne
  water_main_threshold_upper: "1.575"
  water_main_threshold_lower: "1.545"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  logs:
    # Der Wasser-ADC misst 200-mal pro Sekunde. Auf DEBUG wäre das Log nicht
    # mehr lesbar.
    sensor: INFO
    adc: INFO
    binary_sensor: INFO

api:
  encryption:
    key: !secret api_key_zaehlerecke

# Updates über WLAN werden mit dem API-Schlüssel verschlüsselt.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Zaehlerecke Fallback"
    password: !secret fallback_password

captive_portal:

# Die Zählerstände überstehen Neustarts. ESPHome schreibt sie höchstens einmal
# pro Minute in den Flash, damit der Speicher nicht vorzeitig verschleißt. Bei
# einem Stromausfall fehlt also schlimmstenfalls eine Minute.
globals:
  - id: gas_count # zählt Impulse zu je 0,01 m³
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Wasser in Mikrolitern, weil ein Zacken des Sternrads keine glatte Zahl
  # von Millilitern ist. uint64_t reicht praktisch unbegrenzt.
  - id: water_main_ul
    type: uint64_t
    restore_value: true
    initial_value: "0"
  # Wasser-Impulse seit der letzten Durchfluss-Berechnung
  - id: water_window_pulses
    type: uint32_t
    initial_value: "0"
  # Für den Gasdurchfluss: Zeitpunkt des letzten Impulses und Abstand zum
  # vorletzten, beide in ms seit dem Start (millis). 0 heißt "noch unbekannt".
  - id: gas_last_pulse_ms
    type: uint32_t
    initial_value: "0"
  - id: gas_last_interval_ms
    type: uint32_t
    initial_value: "0"

binary_sensor:
  # Gas: Der Reedkontakt schließt, sobald der Magnet in der letzten Rolle vorbeidreht.
  - platform: gpio
    id: gas_pulse
    name: "Gas Impuls"
    entity_category: diagnostic
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      # Reedkontakte prellen, und am Rand des Magnetfelds schließen sie bei
      # einem Durchgang manchmal zweimal (zwei Pole). delayed_on filtert das
      # Prellen. delayed_off fasst zwei Schließungen innerhalb von 2 s zu
      # einem Impuls zusammen. Bei höchstens 6 m³/h kommt frühestens alle
      # 6 s ein echter Impuls, es geht also keiner verloren.
      - delayed_on: 100ms
      - delayed_off: 2s
    on_press:
      then:
        - lambda: |-
            id(gas_count) += 1;
            // Abstand zum vorigen Impuls merken. Nach mehr als 10 min Pause
            // sagt der Abstand nichts über den aktuellen Durchfluss, dann
            // wartet der Durchfluss-Sensor auf den nächsten Impuls.
            const uint32_t now = millis();
            const uint32_t gap = now - id(gas_last_pulse_ms);
            id(gas_last_interval_ms) =
                (id(gas_last_pulse_ms) != 0 && gap <= ${gas_flow_timeout_ms}) ? gap : 0;
            id(gas_last_pulse_ms) = now;
        - component.update: gas_total
        - component.update: gas_flow

  # Wasser: Jeder Zacken des Sternrads, der unter dem TCRT5000 durchläuft,
  # kippt die Spannung an A0 über die obere bzw. unter die untere Schwelle.
  # Die Hysterese dazwischen verhindert, dass ein langsam drehendes Sternrad
  # mehrfach zählt. Der Komparator des Moduls (D0) hat keine Hysterese und hat
  # bei wenig Durchfluss genau so geflattert.
  - platform: analog_threshold
    id: water_main_pulse
    name: "Wasser Impuls"
    # Schaltet bei voller Last viele Male pro Sekunde
    internal: true
    sensor_id: water_main_adc
    threshold:
      upper: ${water_main_threshold_upper}
      lower: ${water_main_threshold_lower}
    on_press:
      then:
        - lambda: |-
            id(water_main_ul) += ${water_main_ul_per_pulse};
            id(water_window_pulses) += 1;

sensor:
  - platform: template
    id: gas_total
    name: "Gas Zählerstand"
    unit_of_measurement: "m³"
    device_class: gas
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 60s
    lambda: return id(gas_count) * ${gas_m3_per_pulse};

  # Gasdurchfluss aus dem Abstand der letzten beiden Impulse, z. B. für das
  # Feld "Gasdurchfluss" im Energie-Dashboard. Kommt länger kein Impuls, kann
  # der Durchfluss höchstens 1 Impuls pro vergangener Zeit sein. Der Wert sinkt
  # dann stetig und fällt nach 10 min ohne Impuls auf 0 (kleinster messbarer
  # Wert: 0,01 m³ / 10 min = 0,06 m³/h).
  - platform: template
    id: gas_flow
    name: "Gas Durchfluss"
    unit_of_measurement: "m³/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      const uint32_t interval = id(gas_last_interval_ms);
      if (interval == 0) return 0.0f;
      const uint32_t since = millis() - id(gas_last_pulse_ms);
      if (since > ${gas_flow_timeout_ms}) return 0.0f;
      const uint32_t effective = since > interval ? since : interval;
      return ${gas_m3_per_pulse} * 3600000.0f / effective;

  - platform: template
    id: water_main_total
    name: "Wasser Zählerstand"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    lambda: return id(water_main_ul) / 1e9;

  # Wasserdurchfluss aus den Impulsen der letzten 10 s
  - platform: template
    id: water_flow
    name: "Wasser Durchfluss"
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const uint32_t n = id(water_window_pulses);
      id(water_window_pulses) = 0;
      // n Impulse in 10 s, hochgerechnet auf eine Minute
      return n * 6 * ${water_main_ul_per_pulse} / 1e6f;

  # A0 des TCRT5000. Am roten Zeiger sieht er nichts (Rot reflektiert Infrarot
  # wie das weiße Zifferblatt), deshalb schaut er auf das schwarze Sternrad.
  # Dort schwankt A0 nur um etwa 0,1 V. Damit das Rauschen des ESP32-ADC nicht
  # stört, mittelt jede Messung 8 Einzelwerte. Alle 5 ms gemessen, damit auch
  # bei vollem Durchfluss jeder Zacken mehrere Messpunkte bekommt. Bleibt
  # intern, 200 Werte pro Sekunde wären zu viel für Home Assistant.
  - platform: adc
    id: water_main_adc
    pin: GPIO34
    attenuation: 12db
    samples: 8
    update_interval: 5ms
    internal: true

  # Hilfe beim Kalibrieren: kleinster und größter Wert der letzten 2 s.
  # Wenn Wasser läuft, sollten sie deutlich weiter auseinanderliegen als bei
  # stehendem Wasser.
  - platform: copy
    source_id: water_main_adc
    name: "Wasser Sensor Min (2s)"
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - min:
          window_size: 400
          send_every: 400
  - platform: copy
    source_id: water_main_adc
    name: "Wasser Sensor Max (2s)"
    entity_category: diagnostic
    accuracy_decimals: 3
    filters:
      - max:
          window_size: 400
          send_every: 400

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

# Hier einmal den Stand eintragen, der gerade am Zähler steht.
number:
  - platform: template
    id: gas_set
    name: "Gas Zählerstand setzen"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 99999
    step: 0.01
    unit_of_measurement: "m³"
    lambda: return id(gas_count) * ${gas_m3_per_pulse};
    set_action:
      - lambda: id(gas_count) = (uint32_t) lround(x / ${gas_m3_per_pulse});
      - component.update: gas_total

  - platform: template
    id: water_main_set
    name: "Wasser Zählerstand setzen"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 99999
    step: 0.001
    unit_of_measurement: "m³"
    lambda: return id(water_main_ul) / 1e9;
    set_action:
      - lambda: id(water_main_ul) = (uint64_t) llround(x * 1e9);
      - component.update: water_main_total

button:
  - platform: restart
    name: "Neustart"
    entity_category: config
