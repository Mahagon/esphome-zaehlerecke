---
# Zählerecke: liest den Gaszähler über einen Reedkontakt und den
# Hauptwasserzähler über einen TCRT5000 aus.
# Board: ESP32-DevKit (ESP32-WROOM-32)
#
# Verdrahtung:
#   Reedkontakt MK04 (Gas)       GPIO27 und GND, wie herum ist egal
#   TCRT5000 Wasser (Heitland)   VCC an 3V3, GND an GND, A0 an GPIO34, D0 bleibt frei
#   TCRT5000 Allmess (später)    A0 an GPIO35
#
# Die Secrets stehen in secrets.yaml. Die Datei ist nicht im Git,
# eine Vorlage liegt in secrets.yaml.example.

substitutions:
  name: zaehlerecke
  friendly_name: Zählerecke

  # Auf dem Typenschild des Apator Metrix G4 steht "1 imp = 0,01 m³".
  gas_m3_per_pulse: "0.01"

  # Nach so vielen ms ohne Gas-Impuls gilt der Durchfluss als 0 (10 min).
  gas_flow_timeout_ms: "600000"

  # Heitland: Eine Umdrehung des x0,0001-Zeigers sind 0,001 m³, also 1 Liter.
  water_main_liter_per_pulse: "1"

  # Nach so vielen ms ohne Wasser-Impuls gilt der Durchfluss als 0 (10 min).
  water_flow_timeout_ms: "600000"

  # Schaltschwellen des TCRT5000 in Volt, mit Hysterese. Bis zur Kalibrierung
  # sind das Platzhalter (siehe README). Danach gilt:
  #   upper = Min + 60 % der Spanne, lower = Min + 40 % der Spanne
  water_main_threshold_upper: "1.60"
  water_main_threshold_lower: "1.40"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  logs:
    # Der Wasser-ADC misst 50-mal pro Sekunde. Auf DEBUG wäre das Log nicht mehr lesbar.
    sensor: INFO
    adc: INFO

api:
  encryption:
    key: !secret api_key_zaehlerecke

# Updates über WLAN werden mit dem API-Schlüssel verschlüsselt.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Zaehlerecke Fallback"
    password: !secret fallback_password

captive_portal:

# Die Zählerstände überstehen Neustarts. ESPHome schreibt sie höchstens einmal
# pro Minute in den Flash, damit der Speicher nicht vorzeitig verschleißt. Bei
# einem Stromausfall fehlt also schlimmstenfalls eine Minute.
globals:
  - id: gas_count # zählt Impulse zu je 0,01 m³
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: water_main_count # zählt Impulse zu je 1 Liter
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Für den Gasdurchfluss: Zeitpunkt des letzten Impulses und Abstand zum
  # vorletzten, beide in ms seit dem Start (millis). 0 heißt "noch unbekannt".
  - id: gas_last_pulse_ms
    type: uint32_t
    initial_value: "0"
  - id: gas_last_interval_ms
    type: uint32_t
    initial_value: "0"
  # Dasselbe für den Wasserdurchfluss.
  - id: water_last_pulse_ms
    type: uint32_t
    initial_value: "0"
  - id: water_last_interval_ms
    type: uint32_t
    initial_value: "0"

binary_sensor:
  # Gas: Der Reedkontakt schließt, sobald der Magnet in der letzten Rolle vorbeidreht.
  - platform: gpio
    id: gas_pulse
    name: "Gas Impuls"
    entity_category: diagnostic
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      # Reedkontakte prellen, und am Rand des Magnetfelds schließen sie bei
      # einem Durchgang manchmal zweimal (zwei Pole). delayed_on filtert das
      # Prellen. delayed_off fasst zwei Schließungen innerhalb von 2 s zu
      # einem Impuls zusammen. Bei höchstens 6 m³/h kommt frühestens alle
      # 6 s ein echter Impuls, es geht also keiner verloren.
      - delayed_on: 100ms
      - delayed_off: 2s
    on_press:
      then:
        - lambda: |-
            id(gas_count) += 1;
            // Abstand zum vorigen Impuls merken. Nach mehr als 10 min Pause
            // sagt der Abstand nichts über den aktuellen Durchfluss, dann
            // wartet der Durchfluss-Sensor auf den nächsten Impuls.
            const uint32_t now = millis();
            const uint32_t gap = now - id(gas_last_pulse_ms);
            id(gas_last_interval_ms) =
                (id(gas_last_pulse_ms) != 0 && gap <= ${gas_flow_timeout_ms}) ? gap : 0;
            id(gas_last_pulse_ms) = now;
        - component.update: gas_total
        - component.update: gas_flow

  # Wasser: Wenn der Zeiger unter dem TCRT5000 durchläuft, kippt die Spannung
  # über bzw. unter die Schwelle. Welche Richtung, spielt keine Rolle, weil das
  # pro Umdrehung genau einmal passiert.
  - platform: analog_threshold
    id: water_main_pulse
    name: "Wasser Impuls"
    entity_category: diagnostic
    sensor_id: water_main_adc
    threshold:
      upper: ${water_main_threshold_upper}
      lower: ${water_main_threshold_lower}
    on_press:
      then:
        - lambda: |-
            id(water_main_count) += ${water_main_liter_per_pulse};
            // Wie beim Gas: Abstand zum vorigen Impuls für den Durchfluss.
            const uint32_t now = millis();
            const uint32_t gap = now - id(water_last_pulse_ms);
            id(water_last_interval_ms) =
                (id(water_last_pulse_ms) != 0 && gap <= ${water_flow_timeout_ms}) ? gap : 0;
            id(water_last_pulse_ms) = now;
        - component.update: water_main_total
        - component.update: water_flow

sensor:
  - platform: template
    id: gas_total
    name: "Gas Zählerstand"
    unit_of_measurement: "m³"
    device_class: gas
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 60s
    lambda: return id(gas_count) * ${gas_m3_per_pulse};

  # Gasdurchfluss aus dem Abstand der letzten beiden Impulse, z. B. für das
  # Feld "Gasdurchfluss" im Energie-Dashboard. Kommt länger kein Impuls, kann
  # der Durchfluss höchstens 1 Impuls pro vergangener Zeit sein. Der Wert sinkt
  # dann stetig und fällt nach 10 min ohne Impuls auf 0 (kleinster messbarer
  # Wert: 0,01 m³ / 10 min = 0,06 m³/h).
  - platform: template
    id: gas_flow
    name: "Gas Durchfluss"
    unit_of_measurement: "m³/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      const uint32_t interval = id(gas_last_interval_ms);
      if (interval == 0) return 0.0f;
      const uint32_t since = millis() - id(gas_last_pulse_ms);
      if (since > ${gas_flow_timeout_ms}) return 0.0f;
      const uint32_t effective = since > interval ? since : interval;
      return ${gas_m3_per_pulse} * 3600000.0f / effective;

  - platform: template
    id: water_main_total
    name: "Wasser Zählerstand"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    lambda: return id(water_main_count) / 1000.0;

  # Wasserdurchfluss nach demselben Prinzip wie beim Gas. Kleinster messbarer
  # Wert: 1 L / 10 min = 0,1 L/min. Bei voller Last (Q3 = 4 m³/h, etwa
  # 67 L/min) kommt knapp jede Sekunde ein Impuls.
  - platform: template
    id: water_flow
    name: "Wasser Durchfluss"
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      const uint32_t interval = id(water_last_interval_ms);
      if (interval == 0) return 0.0f;
      const uint32_t since = millis() - id(water_last_pulse_ms);
      if (since > ${water_flow_timeout_ms}) return 0.0f;
      const uint32_t effective = since > interval ? since : interval;
      return ${water_main_liter_per_pulse} * 60000.0f / effective;

  # Rohwert vom A0-Ausgang des TCRT5000. Er bleibt intern, weil 50 Werte pro
  # Sekunde für Home Assistant zu viel wären.
  - platform: adc
    id: water_main_adc
    pin: GPIO34
    attenuation: 12db
    update_interval: 20ms
    internal: true

  # Hilfe beim Kalibrieren: kleinster und größter Rohwert der letzten 5 s.
  # Wenn Wasser läuft, sollten die beiden mindestens etwa 0,3 V auseinanderliegen.
  - platform: copy
    source_id: water_main_adc
    name: "Wasser Sensor Min (5s)"
    entity_category: diagnostic
    accuracy_decimals: 2
    filters:
      - min:
          window_size: 250
          send_every: 250
  - platform: copy
    source_id: water_main_adc
    name: "Wasser Sensor Max (5s)"
    entity_category: diagnostic
    accuracy_decimals: 2
    filters:
      - max:
          window_size: 250
          send_every: 250

  - platform: wifi_signal
    name: "WLAN Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

# Hier einmal den Stand eintragen, der gerade am Zähler steht.
number:
  - platform: template
    id: gas_set
    name: "Gas Zählerstand setzen"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 99999
    step: 0.01
    unit_of_measurement: "m³"
    lambda: return id(gas_count) * ${gas_m3_per_pulse};
    set_action:
      - lambda: id(gas_count) = (uint32_t) lround(x / ${gas_m3_per_pulse});
      - component.update: gas_total

  - platform: template
    id: water_main_set
    name: "Wasser Zählerstand setzen"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 99999
    step: 0.001
    unit_of_measurement: "m³"
    lambda: return id(water_main_count) / 1000.0;
    set_action:
      - lambda: id(water_main_count) = (uint32_t) lround(x * 1000.0);
      - component.update: water_main_total

button:
  - platform: restart
    name: "Neustart"
    entity_category: config
